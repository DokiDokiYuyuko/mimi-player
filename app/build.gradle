plugins { id 'com.android.application' }
android {
    namespace 'app.mimi.player'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'app.mimi.player'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.0.0'
    }
    def signingFile = rootProject.file(System.getenv('MIMI_SIGNING_PROPERTIES') ?: 'signing.properties')
    if (signingFile.exists()) {
        def keys = new Properties(); keys.load(new FileInputStream(signingFile))
        signingConfigs { release { storeFile file(keys['storeFile']); storePassword keys['storePassword']; keyAlias keys['keyAlias']; keyPassword keys['keyPassword'] } }
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; ndk { abiFilters 'arm64-v8a' }; if (signingFile.exists()) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.media3:media3-common:1.9.4'
    implementation 'androidx.media3:media3-session:1.9.4'
    implementation 'androidx.activity:activity:1.10.1'
    implementation files('libs/libvlc-3.7.7-64bit.aar', 'libs/ffmpeg-kit-audio-8.1.9-vlc-cxx.aar')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'com.github.albfernandez:juniversalchardet:2.5.2'
}
